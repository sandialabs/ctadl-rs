[package]
name = "xtask"
version.workspace = true
edition = "2024"

# Developer task runner for the nightly regression suite. Keep its own
# dependencies light so it builds quickly inside the Nix check; the one
# exception is `ctadl-ascent`, explained below.
[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test configs are JSON5 so they can carry inline comments (e.g. why a line was
# dropped from `expected_lines`).
json5 = "1.3"
# Used by the jvm-reader regression checks (compile .java -> exercise the
# library on the resulting .class / .jar).
jvm-reader.workspace = true
# Likewise for the dex-reader checks (compile .java -> .dex, parse it, plus a
# real-world APK).
dex-reader.workspace = true
# The cil:* checks read Mono.Cecil's test corpus with cil-reader and diff the
# dumps against CecilDump's; `cil-dump` holds the dump format. The parity rules
# (corpus, goldens) live here, in src/cil/parity.rs.
cil-reader.workspace = true
cil-dump.workspace = true
# The `cil:frontend` and `cil:taint` checks run the CIL frontend and the SSA pipeline in
# process.
ctadl-cil.workspace = true
ctadl-ir.workspace = true
# `cil:frontend` resolves the span a global is declared at.
source-info.workspace = true
# `cil:models` reads the accepted-miss file's function-id patterns. Already built for
# ctadl-ascent.
regex = "1.12"
# The Android checks read what `ctadl` wrote -- decoded manifests and index facts
# such as `intent_pair.parquet` -- through the analyzer's own loaders rather than
# re-implementing them. This is the one heavy dependency here: it builds the
# whole analyzer.
ctadl-ascent.workspace = true
# The `--mem2reg` cases and `apk:merged-classes` read the `notifications.sarif` an import or
# an index writes, through the module that writes it. Already built for ctadl-ascent.
ctadl-import.workspace = true
# `--compare-paths` diffs two runs' path sets with the multiset core the index tests share.
multiset-diff.workspace = true
# The JNI `+apk` cases package a DEX and a shared library into an APK so the
# importer can be made to find `lib/<abi>` for itself. Not a new dependency in
# practice: dex-reader already builds `zip` to read APKs.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `Facts:*` cases read the gzipped fact tables a pcode import writes. Already built for zip.
flate2 = "1"
