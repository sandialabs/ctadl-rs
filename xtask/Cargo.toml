[package]
name = "xtask"
version.workspace = true
edition = "2021"

# Developer task runner for the nightly regression suite. This is intentionally
# a tiny, dependency-light binary so it builds quickly inside the Nix check.
[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
