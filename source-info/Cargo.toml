[package]
name = "source-info"
version.workspace = true
edition = "2024"

[dependencies]
hashbrown = "0.16"
serde = { version = "1",    optional = true, features = ["derive"] }
parquet = "59"
arrow = "59"
sha2 = "0.10"

[dev-dependencies]
tempfile   = "3"
serde       = { version = "1", features = ["derive"] }

[features]
serde = ["dep:serde"]

[[example]]
name = "large"

[[example]]
name = "parquet_out"
