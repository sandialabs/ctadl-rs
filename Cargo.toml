[workspace]
resolver = "3"
members = ["ctadl-ascent", "ctadl-flowy", "ctadl-ir", "pcode-reader", "trie", "tailshare", "immortal", "xtask"]
# `nix build .#packages.default` runs a bare `cargo build` at this root, so
# every member's bins land in the distro. Excluding a directory drops its
# membership, and with it those bins.
#
# In-tree path dependencies become members automatically: dex-reader and
# jvm-reader are libraries used by ctadl-ascent but their standalone bins must
# not ship, so they are excluded here while still being built as ordinary
# path-dependency libraries.
#
# sarif-util is different -- nothing depends on it. It is a standalone
# developer utility for inspecting SARIF output (`sarif-util`, `show-regions`)
# that must not ship either. Excluding it means nothing in-tree builds it at
# all: it is outside `cargo test --workspace` and the per-PR clippy job, keeps
# its own Cargo.lock, and is built on demand with
#   cargo build --manifest-path sarif-util/Cargo.toml
exclude = ["dex-reader", "jvm-reader", "sarif-util"]

[workspace.package]
version = "0.1.0"

# Section defining rustc compiler lint rules for the workspace
[workspace.lints.rust]

# Fail on violations of the `rust-2018-idioms` lint group
rust-2018-idioms = "deny"

# Section defining Clippy lint rules for the workspace
[workspace.lints.clippy]

# Require a "SAFETY" comment preceding any unsafe code
undocumented_unsafe_blocks = "deny"

# Ignore a couple Clippy warnings that aren't important IMO
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
# Our Ascent code uses _ as a name all the time
just_underscores_and_digits = "allow"

[profile.release]
debug = false
strip = "debuginfo"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
