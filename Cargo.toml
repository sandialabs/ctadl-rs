[workspace]
resolver = "3"
members = ["ctadl-ascent", "ctadl-flowy", "ctadl-import", "ctadl-ir", "ctadl-jvm", "pcode-reader", "trie", "tailshare", "immortal", "xtask", "dex-reader", "jvm-reader"]

# One version for the whole tree. Every member takes it with
# `version.workspace = true`, so a release tag names exactly one thing: this
# number. It is what `ctadl --version` prints, and it is what any of these
# crates would carry if we ever publish them. Bump it here and nowhere else.
[workspace.package]
version = "0.1.2"

# Section defining rustc compiler lint rules for the workspace
[workspace.lints.rust]

# Fail on violations of the `rust-2018-idioms` lint group
rust-2018-idioms = "deny"

# Section defining Clippy lint rules for the workspace
[workspace.lints.clippy]

# Require a "SAFETY" comment preceding any unsafe code
undocumented_unsafe_blocks = "deny"

# Ignore a couple Clippy warnings that aren't important IMO
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
# Our Ascent code uses _ as a name all the time
just_underscores_and_digits = "allow"

[profile.release]
debug = false
strip = "debuginfo"
lto = "thin"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
