[package]
name = "ctadl-import"
version.workspace = true
edition = "2024"

[dependencies]
bitcode = { version = "0.6", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctadl-ir = { workspace = true, features = ["serde"] }
hashbrown = "0.16"
json5 = "1.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-sarif = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
source-info = { workspace = true, features = ["serde"] }
thiserror = "2"

# Error variants, one per language. Each one is a `#[from]` on a single reader's error type,
# behind a feature, so a program that reads only Dex does not build a JVM reader or a
# tree-sitter grammar. The doc on `Error` in `src/error.rs` explains why all the variants live in
# one enum instead of one enum per language.
cil-reader = { workspace = true, optional = true }
ctadl-flowy = { workspace = true, features = ["serde"], optional = true }
dex-reader = { workspace = true, optional = true }
jvm-reader = { workspace = true, optional = true }
tree-sitter = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
dex = ["dep:dex-reader"]
jvm = ["dep:jvm-reader"]
pcode = []
ts = ["dep:tree-sitter"]
flowy = ["dep:ctadl-flowy"]
cil = ["dep:cil-reader"]

[lints]
workspace = true
