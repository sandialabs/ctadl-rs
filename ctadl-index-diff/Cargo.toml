[package]
name = "ctadl-index-diff"
version.workspace = true
edition = "2024"

[dependencies]
ctadl-index.workspace = true
hashbrown = "0.16"
multiset-diff.workspace = true
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
ctadl-ir = { workspace = true, features = ["serde"] }
source-info = { workspace = true, features = ["serde"] }
tempfile = "3"

[lints]
workspace = true
