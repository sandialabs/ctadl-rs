[package]
name = "ctadl-c"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0"
ctadl-import = { path = "../ctadl-import", features = ["ts"] }
ctadl-ir = { path = "../ctadl-ir", features = ["serde"] }
hashbrown = "0.16"
internment = { version = "0.8", features = ["arc", "serde"] }
log = "0.4"
source-info = { path = "../source-info", features = ["serde"] }
streaming-iterator = { version = "0.1", features = ["alloc"] }
tree-sitter = "0.26"
tree-sitter-c = "0.24"

# The engine, for tests only. Cargo permits a cycle through dev-dependencies, and this is what
# it is for: 143 of the 264 tests in `tests.rs` call `index_program`/`get_summary`/`check_flow`,
# i.e. the datalog engine, and they are the regression suite for the C front end's *lowering* --
# splitting them out would mean `pub`-ing whatever they reach through `super::` and moving 5,000
# lines to say the same thing. The cost is that `cargo test -p ctadl-c` builds the engine, and
# that the cycle must be broken before either crate could be published with a path-less version.
# Both are acceptable today; see `ctadl-lib-update.md` §1.2 for the two alternatives.
[dev-dependencies]
ctadl-ascent = { path = "../ctadl-ascent" }
env_logger = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
test-log = "0.2.19"

[lints]
workspace = true
