id = "ctadl-models"
name = "CTADL Models"
description = "Syntax highlighting for the ctadl model DSL (.ctadl), the taint-model language of the ctadl analyzer."
version = "0.1.0"
schema_version = 1
authors = ["Denis Bueno <dbueno@gmail.com>"]
repository = "https://github.com/sandialabs/ctadl-rs"

# The grammar lives in a subdirectory of the ctadl-rs repository. Zed clones `repository` at
# `rev` and builds the parser in `path`. For local grammar work, point `repository` at a
# `file://` clone and `rev` at a commit in it.
#
# TODO: set `rev` to a pushed commit that contains `ctadl-ascent/tree-sitter-ctadl-models`.
[grammars.ctadl_models]
repository = "https://github.com/sandialabs/ctadl-rs"
rev = "0000000000000000000000000000000000000000"
path = "ctadl-ascent/tree-sitter-ctadl-models"
