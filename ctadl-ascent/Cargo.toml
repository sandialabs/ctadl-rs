[package]
name = "ctadl-ascent"
version.workspace = true
edition = "2024"
default-run = "ctadl"

[[bin]]
name = "ctadl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arrow = "58"
ascent = "0.8.0"
ascent-byods-rels = "0.8.0"
ascent_base = "0.8.0"
ascent_macro = "0.8.0"
bitcode = { version = "0.6", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help", "env"] }
csv = "1.3.*"
ctadl-flowy = { path = "../ctadl-flowy", features = ["serde"] }
ctadl-ir = { path = "../ctadl-ir", features = ["serde"] }
datafusion = "53"
derive_builder = "0.20"
dex-reader = { path = "../dex-reader" }
env_logger = "0.11"
flate2 = "1"
hashbrown = "0.16"
internment = { version = "0.8", features = ["arc", "serde"] }
itertools = "0.14"
json5 = "1.3"
jvm-reader = { path = "../jvm-reader" }
lazy_static = "1"
libc = "0.2"
log = "0.4"
log-once = "0.4"
memmap = "0.7"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
packed_struct = "0.10"
parquet = "58"
paste = "1.0"
pcode-reader = { path = "../pcode-reader" }
pest = "2.8"
pest_derive = "2.8"
rayon = "1.10"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde-sarif = "0.8"
rustc_graphviz = { path = "../rustc_graphviz" }
rustc-hash = "2"
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
tailshare = { path = "../tailshare", features = ["serde"] }
source-info = { path = "../source-info", features = ["serde"] }
streaming-iterator = { version = "0.1", features = ["alloc"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
trie = { path = "../trie" }
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-lua = "0.5"
tempfile = "3"
which = "6"
elsa = "1.11"
immortal = { path = "../immortal" }

[dev-dependencies]
test-log = "0.2.19"
# Building the split APKs of an app bundle (native-only, resource-only) as test fixtures.
zip = "0.6"
# For `examples/show-regions.rs` only. Examples see dev-dependencies, so putting
# it here keeps it out of the shipped binary. The example's other crates (clap,
# serde, serde_json, url) are already ordinary dependencies above.
percent-encoding = "2.3"

[[bench]]
name = "locals_trie"
harness = false

[[bench]]
name = "hybrid_set"
harness = false

[lints]
workspace = true
