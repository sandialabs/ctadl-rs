id = "portcullis"
name = "Portcullis"
description = "Syntax highlighting for Portcullis (.ctadl), the taint-model language of the ctadl analyzer."
version = "0.1.0"
schema_version = 1
authors = ["Denis Bueno <dbueno@gmail.com>"]
repository = "https://github.com/sandialabs/ctadl-rs"

# The grammar lives in a subdirectory of the ctadl-rs repository. Zed clones `repository` at
# `rev` and builds the parser in `path`. For local grammar work, point `repository` at a
# `file://` clone and `rev` at a commit in it.
[grammars.portcullis]
repository = "https://github.com/sandialabs/ctadl-rs"
rev = "9d66837ac4d0a19d6e71c0ddd9eca22a77dce66f"
path = "ctadl-ascent/tree-sitter-portcullis"
