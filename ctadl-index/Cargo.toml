[package]
name = "ctadl-index"
version.workspace = true
edition = "2024"

[dependencies]
arrow = "59"
ascent = "0.8.0"
ascent_base = "0.8.0"
bitcode = { version = "0.6", features = ["serde"] }
ctadl-flowy = { path = "../frontends/ctadl-flowy", features = ["serde"] }
ctadl-import = { path = "../ctadl-import", features = ["dex", "jvm", "flowy"] }
ctadl-ir = { path = "../ctadl-ir", features = ["serde"] }
# For `Error::DataFusion` only. `datafusion` re-exports this error type; naming it here instead
# lets this crate build alongside datafusion rather than after it.
datafusion-common = "55"
derive_builder = "0.20"
dex-reader = { path = "../readers/dex-reader" }
hashbrown = "0.16"
immortal = { path = "../immortal", features = ["serde"] }
internment = { version = "0.8", features = ["arc", "serde"] }
itertools = "0.14"
json5 = "1.3"
jvm-reader = { path = "../readers/jvm-reader" }
lazy_static = "1"
libc = "0.2"
log = "0.4"
lsm = { path = "../lsm" }
packed_struct = "0.10"
parquet = "59"
paste = "1.0"
rayon = "1.10"
regex = "1.12"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
source-info = { path = "../source-info", features = ["serde"] }
streaming-iterator = { version = "0.1", features = ["alloc"] }
tailshare = { path = "../tailshare", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "locals_trie"
harness = false

[[bench]]
name = "hybrid_set"
harness = false

[lints]
workspace = true
