[package]
name = "byods-example"
edition = "2024"
version.workspace = true

[dependencies]
csv = "1.3.*"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help", "env"] }
itertools = "0.13"
ascent = "0.8.0"
ascent_base = "0.8.0"
ascent_macro = "0.8.0"
ascent-byods-rels = "0.8.0"
arcstr = { version = "1", features = ["serde"] }
strumbra = { version = "0.6", features = ["serde"] }
lazy_static = "1"
anyhow = "1.0"
nix = { version = "0.27.1", features = ["resource"] }
lmdb-rkv = "0.14"
bincode = "2"
