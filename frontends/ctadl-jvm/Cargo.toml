[package]
name = "ctadl-jvm"
version.workspace = true
edition = "2024"

[dependencies]
ctadl-import = { workspace = true, features = ["jvm"] }
ctadl-ir = { workspace = true, features = ["serde"] }
hashbrown = "0.16"
jvm-reader.workspace = true
log = "0.4"
rayon = "1.10"
smallvec = "1"
source-info = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
