[package]
name = "ctadl-pcode"
version.workspace = true
edition = "2024"

[dependencies]
ctadl-import = { workspace = true, features = ["pcode"] }
ctadl-ir = { workspace = true, features = ["serde"] }
crc32fast = "1"
flate2 = "1"
hashbrown = "0.16"
log = "0.4"
log-once = "0.4"
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "std"] }
pcode-reader.workspace = true
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
source-info = { workspace = true, features = ["serde"] }
tempfile = "3"
which = "6"

[dev-dependencies]
test-log = "0.2.19"

[lints]
workspace = true
