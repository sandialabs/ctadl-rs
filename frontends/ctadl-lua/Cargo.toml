[package]
name = "ctadl-lua"
version.workspace = true
edition = "2024"

[dependencies]
ctadl-import = { workspace = true, features = ["ts"] }
ctadl-ir = { workspace = true, features = ["serde"] }
hashbrown = "0.16"
log = "0.4"
smallvec = "1"
source-info = { workspace = true, features = ["serde"] }
tree-sitter = "0.26"
tree-sitter-lua = "0.5"

[dev-dependencies]
tempfile = "3"
test-log = "0.2.19"

[lints]
workspace = true
