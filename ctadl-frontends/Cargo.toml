[package]
name = "ctadl-frontends"
version.workspace = true
edition = "2024"

[dependencies]
ctadl-import = { path = "../ctadl-import" }
ctadl-ir = { path = "../ctadl-ir", features = ["serde"] }
log = "0.4"

# The languages. Each one is optional, and each one brings in the matching `ctadl-import` error
# variants. A program that reads only Dex therefore builds no tree-sitter grammar and no Ghidra
# support.
ctadl-c = { path = "../ctadl-c", optional = true }
ctadl-dex = { path = "../ctadl-dex", optional = true }
ctadl-flowy = { path = "../ctadl-flowy", features = ["serde"], optional = true }
ctadl-jvm = { path = "../ctadl-jvm", optional = true }
ctadl-lua = { path = "../ctadl-lua", optional = true }
ctadl-pcode = { path = "../ctadl-pcode", optional = true }

# The container formats read the ZIP directory of an APK or a bundle themselves. That code is
# already in `dex-reader::apk`, so the `apk` feature pulls it in whether or not the Dex lowering
# is wanted.
bitcode = { version = "0.6", features = ["serde"], optional = true }
dex-reader = { path = "../dex-reader", optional = true }

[features]
# `xapk` is on by default, even though the plan left it off. A bundle is a ZIP file of APKs,
# and `dex_reader::apk` already reads that, so turning it on adds no dependency. Leaving it off
# would also mean its unit tests never ran under `cargo test`.
default = ["dex", "jvm", "apk", "xapk"]
dex = ["dep:ctadl-dex", "ctadl-import/dex"]
jvm = ["dep:ctadl-jvm", "ctadl-import/jvm"]
# Reads the Dex half of an APK and extracts its native libraries. Turning those libraries into
# IR needs `pcode` as well. Without `pcode`, the extraction step reports that this build has no
# native front end and imports the Java half on its own. That is what already happens on a
# machine with no Ghidra.
apk = ["dex", "dep:dex-reader"]
xapk = ["apk"]
pcode = ["dep:ctadl-pcode", "ctadl-import/pcode"]
lua = ["dep:ctadl-lua", "ctadl-import/ts"]
c = ["dep:ctadl-c", "ctadl-import/ts"]
flowy = ["dep:ctadl-flowy", "dep:bitcode", "ctadl-import/flowy"]

[lints]
workspace = true
