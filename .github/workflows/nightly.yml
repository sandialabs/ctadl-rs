name: Nightly

# Runs only on a nightly schedule (not on push/PR).
# Use workflow_dispatch to trigger a run manually for testing.
on:
  schedule:
    # 07:00 UTC every day (~midnight US Pacific / early morning US Eastern).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

