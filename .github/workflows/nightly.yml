name: Nightly

# Runs only on a nightly schedule (not on push/PR).
# Use workflow_dispatch to trigger a run manually for testing.
on:
  schedule:
    # 07:00 UTC every day (~midnight US Pacific / early morning US Eastern).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Needed for the (tokenless, OIDC-based) FlakeHub Nix cache.
  id-token: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix build cache
        uses: DeterminateSystems/flakehub-cache-action@main

      # All expensive/long-running regression logic lives in the flake
      # (checks.<system>.nightly). It currently runs the cheap suite plus a
      # placeholder; fill in the expensive suite there, not in this YAML.
      # ubuntu-latest runners are x86_64-linux.
      - name: Run nightly checks
        run: nix build --print-build-logs '.#checks.x86_64-linux.nightly'
