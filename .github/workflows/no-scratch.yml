name: No scratch

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-scratch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reject scratch files and markers
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Split so this workflow does not trip its own check.
          marker="DO-NOT""-MERGE"

          fail=0
          while IFS= read -r -d '' f; do
            case "$f" in
              scratch/*|*/scratch/*|*.scratch.*)
                echo "::error file=$f::scratch path must not be merged"
                fail=1
                continue
                ;;
            esac

            if git diff "$BASE...$HEAD" -- "$f" \
              | grep -v '^+++' \
              | grep -q "^+.*$marker"
            then
              echo "::error file=$f::added line contains $marker"
              fail=1
            fi
          done < <(git diff -z --name-only --diff-filter=AM "$BASE...$HEAD")

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Remove the scratch files/lines above, or drop the $marker comment if the code is meant to ship."
            exit 1
          fi
