name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Needed for the (tokenless, OIDC-based) FlakeHub Nix cache.
  id-token: write

jobs:
  cheap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix build cache
        uses: DeterminateSystems/flakehub-cache-action@main

      # All test logic lives in the flake (checks.<system>.cheap):
      # formatting, clippy, and the fast workspace unit tests. ubuntu-latest
      # runners are x86_64-linux.
      - name: Run cheap checks
        run: nix build --print-build-logs '.#checks.x86_64-linux.cheap'
