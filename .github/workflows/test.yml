name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        env:
          # The action exports these only when they are unset; setting them for this step keeps
          # them out of the later steps, so tests build with the default debug info and backtraces.
          CARGO_PROFILE_DEV_DEBUG: ""
          RUST_BACKTRACE: ""
        with:
          components: rustfmt, clippy
          # Warnings fail only the Clippy step, which passes -Dwarnings itself.
          build-warnings: ""
          # Swatinem/rust-cache below caches the build.
          cache: false

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -- -Dwarnings

      - name: Run workspace tests
        run: cargo test --workspace --verbose
