[package]
name = "ctadl-sarif-diff"
version.workspace = true
edition = "2024"

[dependencies]
diff-report.workspace = true
multiset-diff.workspace = true
rustc-hash = "2"
sarif-canon.workspace = true
# The crate `ctadl query` writes its SARIF with, so reader and writer share one schema.
serde-sarif = "0.8"
# `derive` for the report, and for `serde-sarif`, which derives with serde's macros but does
# not turn them on itself.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
